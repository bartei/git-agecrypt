[toolchain]
# 1.85 is the edition-2024 minimum, but transitive `rpassword` 7.5 (via
# age) uses let-chains, stable only from 1.88, so 1.88 is the effective MSRV.
# Any rustup-managed environment will auto-install this on `cd`,
# keeping local builds aligned with the declared MSRV in Cargo.toml.
channel = "1.88"
components = ["rustfmt", "clippy"]
profile = "minimal"
