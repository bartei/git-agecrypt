name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - name: Configure git identity
        run: |
          git config --global user.email "ci@git-agecrypt.test"
          git config --global user.name "git-agecrypt CI"
          git config --global init.defaultBranch main
          git --version
          git config --global --list
        shell: bash
      - run: cargo build --tests
      - name: e2e, repeated
        shell: bash
        env:
          GIT_TRACE: 1
          RUST_LOG: debug
        run: |
          for i in 1 2 3 4; do
            echo "::group::e2e run $i"
            cargo test --test e2e --no-fail-fast 2>&1 | grep -vE '^\s+(Compiling|Finished)' || true
            echo "::endgroup::"
          done
